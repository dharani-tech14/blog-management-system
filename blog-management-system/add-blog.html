<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <h1>Add New Blog</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="add-blog.html">Add Blog</a>
        </nav>

    </header>

    <main>

        <form id="blogForm">

            <label>Blog Title</label>
            <input type="text" id="title" placeholder="Enter Blog Title">
            <small id="titleError" class="error"></small>

            <label>Author Name</label>
            <input type="text" id="author" placeholder="Enter Author Name">
            <small id="authorError" class="error"></small>

            <label>Blog Content</label>
            <textarea id="content" rows="8" placeholder="Write your blog here..."></textarea>
            <small id="contentError" class="error"></small>

            <button type="submit">Submit Blog</button>

            <p id="success"></p>

        </form>


    </main>

    <footer>

        <p>
            © 2026 Blog Management System | Codomax Internship
        </p>

    </footer>
    <script src="js/script.js"></script>
</body>

</html>
